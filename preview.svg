<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Workspace Dots — Omarchy bar widget</title>
  <desc id="description">Editorial preview of the three-workspace dot indicator, showing the active pill moving from workspace two to three. The widget is enlarged for clarity.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101821"/>
      <stop offset=".55" stop-color="#0B1219"/>
      <stop offset="1" stop-color="#070D12"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#347463" stop-opacity=".28"/>
      <stop offset="1" stop-color="#347463" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#18242C"/>
      <stop offset="1" stop-color="#111A21"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop stop-color="#ACF5D2"/>
      <stop offset="1" stop-color="#84DDBC"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#DDF8E9" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1270" cy="418" rx="630" ry="520" fill="url(#glow)"/>
  <path d="M72 116H1528M72 756H1528" stroke="#DDF8E9" stroke-opacity=".16"/>

  <!-- Identity -->
  <circle cx="91" cy="72" r="6" fill="#91B3A8"/>
  <rect x="106" y="66" width="24" height="12" rx="6" fill="url(#accent)"/>
  <circle cx="145" cy="72" r="6" fill="#91B3A8"/>
  <text x="172" y="79" fill="#EAF5EE" font-family="Noto Sans, sans-serif" font-weight="700" font-size="20" letter-spacing="3">WORKSPACE DOTS</text>
  <text x="1528" y="78" fill="#95A9A7" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="17" letter-spacing="1.5">OMARCHY  /  BAR WIDGET</text>

  <!-- Title and explanation -->
  <text x="98" y="272" fill="#F1F7F1" font-family="Noto Sans, sans-serif" font-weight="700" font-size="82" letter-spacing="-4">Focus,</text>
  <text x="98" y="370" fill="url(#accent)" font-family="Noto Sans, sans-serif" font-weight="700" font-size="82" letter-spacing="-4">in motion.</text>
  <rect x="101" y="408" width="46" height="3" rx="1.5" fill="#9BE8C5"/>
  <text x="98" y="472" fill="#C3D3CF" font-family="Noto Sans, sans-serif" font-size="25">A quieter way to navigate</text>
  <text x="98" y="509" fill="#C3D3CF" font-family="Noto Sans, sans-serif" font-size="25">your Omarchy workspaces.</text>
  <text x="99" y="617" fill="#87A69B" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="1">THE ACTIVE DOT BECOMES A PILL</text>
  <path d="M100 638H442" stroke="#759C8C" stroke-opacity=".5"/>
  <path d="m432 631 10 7-10 7" fill="none" stroke="#759C8C" stroke-width="1.5"/>

  <!-- Enlarged widget states; geometry preserves the 8:16 dot-to-pill ratio -->
  <rect x="785" y="175" width="713" height="540" rx="23" fill="#02090B" opacity=".45"/>
  <rect x="780" y="169" width="713" height="540" rx="23" fill="url(#panel)" stroke="#C9F7DF" stroke-opacity=".2"/>
  <circle cx="819" cy="208" r="5" fill="#65817A"/>
  <circle cx="839" cy="208" r="5" fill="#65817A"/>
  <circle cx="859" cy="208" r="5" fill="#65817A"/>
  <text x="888" y="214" fill="#ACBFB7" font-family="JetBrains Mono, monospace" font-size="15" letter-spacing="1.1">WIDGET STUDY</text>
  <text x="1456" y="214" text-anchor="end" fill="#829C91" font-family="JetBrains Mono, monospace" font-size="14">03 WORKSPACES</text>
  <path d="M780 242H1493" stroke="#C9F7DF" stroke-opacity=".12"/>

  <rect x="815" y="270" width="643" height="164" rx="16" fill="#0D171D" stroke="#C9F7DF" stroke-opacity=".14"/>
  <text x="845" y="305" fill="#96B1A6" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1.2">01  /  FOCUS WORKSPACE 2</text>
  <rect x="844" y="325" width="585" height="83" rx="12" fill="#1E2B31" stroke="#D5FBE5" stroke-opacity=".13"/>
  <circle cx="1067" cy="366.5" r="14" fill="#C5D6D0" opacity=".7"/>
  <rect x="1102" y="352.5" width="56" height="28" rx="14" fill="url(#accent)"/>
  <circle cx="1193" cy="366.5" r="14" fill="#C5D6D0" opacity=".7"/>

  <path d="M1129 442v29" stroke="#9BE8C5" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 5"/>
  <path d="m1123 465 6 7 6-7" fill="none" stroke="#9BE8C5" stroke-width="2"/>
  <text x="1160" y="463" fill="#9AB7A9" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="1">SWITCH</text>

  <rect x="815" y="485" width="643" height="164" rx="16" fill="#0D171D" stroke="#C9F7DF" stroke-opacity=".14"/>
  <text x="845" y="520" fill="#96B1A6" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1.2">02  /  FOCUS WORKSPACE 3</text>
  <rect x="844" y="540" width="585" height="83" rx="12" fill="#1E2B31" stroke="#D5FBE5" stroke-opacity=".13"/>
  <circle cx="1067" cy="581.5" r="14" fill="#C5D6D0" opacity=".7"/>
  <circle cx="1116" cy="581.5" r="14" fill="#C5D6D0" opacity=".7"/>
  <rect x="1151" y="567.5" width="56" height="28" rx="14" fill="url(#accent)"/>
  <text x="1457" y="688" text-anchor="end" fill="#839F93" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing=".5">ENLARGED VIEW · 3.5×</text>

  <!-- Feature strip -->
  <text x="100" y="809" fill="#F1F7F1" font-family="Noto Sans, sans-serif" font-size="27" font-weight="700">8 px</text>
  <text x="100" y="837" fill="#91A9A0" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1">INACTIVE DOT</text>
  <path d="M340 787V842" stroke="#DDF8E9" stroke-opacity=".15"/>
  <text x="376" y="809" fill="#F1F7F1" font-family="Noto Sans, sans-serif" font-size="27" font-weight="700">16 px</text>
  <text x="376" y="837" fill="#91A9A0" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1">ACTIVE PILL</text>
  <path d="M615 787V842" stroke="#DDF8E9" stroke-opacity=".15"/>
  <text x="651" y="809" fill="#F1F7F1" font-family="Noto Sans, sans-serif" font-size="27" font-weight="700">90 ms</text>
  <text x="651" y="837" fill="#91A9A0" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1">SMOOTH TRANSITION</text>
  <text x="1491" y="824" text-anchor="end" fill="#A8E8C8" font-family="JetBrains Mono, monospace" font-size="17" letter-spacing=".5">voyagen.oma-dots ↗</text>
</svg>
